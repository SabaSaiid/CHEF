# Alembic Configuration File for CHEF
# ─────────────────────────────────────
# This file is read by Alembic to find the migration scripts
# and connect to the database.

[alembic]
# Path to migration scripts (relative to this .ini file's parent directory)
script_location = alembic

# Template used to generate migration file names.
# Includes a short description slug for readability.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s

# Prepend sys.path with the backend directory so `app.*` imports work
prepend_sys_path = .

# Timezone for migration file timestamps
timezone = UTC

# The database URL is loaded from app.config at runtime (see alembic/env.py)
# so we don't hardcode it here. This is just a placeholder.
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# Uncomment to auto-format migration files with black:
# hooks = black
# black.type = console_scripts
# black.entrypoint = black

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
