# ─────────────────────────────────────────────────────────────
#  CHEF — Nginx config for serving the React SPA in production
#
#  Key features:
#    - Serves static frontend files
#    - Proxies /api/* requests to the backend container
#    - Supports client-side routing (React Router)
#    - Gzip compression for faster loading
# ─────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip compression ─────────────────────────────────────
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # ── API proxy → backend container ────────────────────────
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Swagger docs proxy ───────────────────────────────────
    location /docs {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
    }

    # ── Static assets (long cache) ───────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── React Router — serve index.html for all other routes ─
    location / {
        try_files $uri $uri/ /index.html;
    }
}
