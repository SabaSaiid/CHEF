name: CI

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-react/package-lock.json
      - name: Install dependencies
        working-directory: ./frontend-react
        run: npm ci
      - name: Build frontend
        working-directory: ./frontend-react
        run: npm run build

  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt
      # Add your pytest commands here when you write backend tests
      # - name: Run tests
      #   working-directory: ./backend
      #   run: pytest
